stage: stream_stage2
name: stream_stage2_anneal_5b
seed: 142
target_tokens: 5000000000
reverse_files: true

tokenizer:
  id: "HuggingFaceTB/SmolLM2-135M"
  vocab_size: 49152
  eos_token_id: 0
  max_doc_tokens: 8192
  hard_doc_limit: 65536

output:
  repo_id: "Dhiraj309/laughlm-135m-shards-v2"
  path_prefix: "stage2"
  private: false
  shard_size_tokens: 500000000

sources:
  - name: fineweb_edu
    repo_id: "HuggingFaceFW/fineweb_edu_100BT-shuffled"
    revision: "main"
    path_prefix: "data"
    file_pattern: "*.parquet"
    reverse_files: true
    weight: 0.20
    columns:
      text: text
      id: id
      url: url
      language: language
      language_score: language_score
      token_count: token_count
      score: score
      int_score: int_score
      dataset: dataset
    required_columns:
      - text
      - id
      - language
      - language_score
      - token_count
      - int_score
    filters:
      languages: [en]
      min_language_score: 0.93
      min_int_score: 3
      min_token_count: 1024
      max_words: 50000
      max_chars: 250000
      missing_policy: reject

  - name: dclm
    repo_id: "HuggingFaceFW/dclm_100BT-shuffled"
    revision: "main"
    path_prefix: "data"
    file_pattern: "*.parquet"
    reverse_files: true
    weight: 0.15
    columns:
      text: text
      id: id
      url: url
      language: language
      language_score: language_score
      fasttext_score: fasttext_score
      dataset: dataset
    required_columns:
      - text
      - id
      - language
      - language_score
      - fasttext_score
    filters:
      languages: [en]
      min_language_score: 0.95
      min_fasttext_score: 0.018112
      min_words: 750
      min_chars: 4000
      max_words: 50000
      max_chars: 250000
      missing_policy: reject

